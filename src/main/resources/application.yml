spring:
  application:
    name: payment-webhook-gateway

  datasource:
    # H2 in PostgreSQL compatibility mode so the same Flyway migrations that run
    # against production PostgreSQL also run here. Switch to a real PostgreSQL
    # with SPRING_PROFILES_ACTIVE=postgres (see docker-compose.yml).
    url: jdbc:h2:mem:webhooks;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      # Flyway owns the schema in every profile. Hibernate never mutates it.
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus

webhooks:
  admin:
    # Shared API key for the /admin operational endpoints. Override in every
    # real environment; the default exists only for local runs and tests.
    api-key: ${ADMIN_API_KEY:local-admin-key}
  stripe:
    endpoint-secret: ${STRIPE_ENDPOINT_SECRET:whsec_test_secret}
  razorpay:
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:rzp_test_secret}

logging:
  level:
    dev.anmol.webhooks: INFO

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:webhooks}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate   # schema owned by Flyway, Hibernate only validates
  flyway:
    enabled: true
